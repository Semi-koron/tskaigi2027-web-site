name: サイドイベント追加
description: サイドイベントをWebサイトに追加する
title: "サイドイベント追加"
labels: ["side-event"]
body:
  - type: markdown
    attributes:
      value: |
        サイドイベントの情報を入力してください。
        このイシューが作成されると、サイドイベントを追加するPRが自動で作成されます。
        内容の修正はPRではなくこのイシューを編集してください（イシューを編集するとPRは作り直され、PRを直接編集した内容は上書きされます）。

  - type: input
    id: link
    attributes:
      label: ConnpassイベントURL
      description: ConnpassのイベントページURL
      placeholder: "https://typescript-jpc.connpass.com/event/379927/"
    validations:
      required: true

  - type: input
    id: thumbnail
    attributes:
      label: ConnpassサムネイルURL
      description: Connpassイベントページのサムネイル画像URL（イベントページで画像を右クリック→「画像のアドレスをコピー」）
      placeholder: "https://media.connpass.com/thumbs/ad/6b/ad6b92024c9501d4f408977f8fed2406.png"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: イベント名
      placeholder: "TSKaigi Mashup #4 プロポーザルの書き方とコツを学ぼう"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: 開催日
      description: YYYY-MM-DD形式で入力してください（サイト上では「2/9 (月)」の形式で表示されます）
      placeholder: "2026-02-09"
    validations:
      required: true

  - type: input
    id: end_time
    attributes:
      label: 終了時刻（任意）
      description: 開催日の終了時刻をHH:MM形式（日本時間）で入力してください。終了時刻を過ぎると「終了済み」と表示されます。空欄の場合や、日付をまたいで終了する場合は、開催日の翌日0:00を終了とみなします
      placeholder: "21:30"
    validations:
      required: false

  - type: input
    id: sponsors
    attributes:
      label: 主催スポンサー
      description: 複数の場合はカンマ区切りで入力してください
      placeholder: "株式会社A, 株式会社B, 株式会社C"
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: イベント詳細
      description: 空欄の場合はPRで手動入力が必要です
      placeholder: |
        TSKaigi採択者によるトークと、TSKaigiのCfP選考担当者によるトークを通じて、CfP応募のコツや選考のポイントを学べる勉強会です。
        初めてCfPに応募しようと考えている方、応募を迷っている・応募に自信がない方におすすめです。
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: タグ（任意）
      description: 複数の場合はカンマ区切りで入力してください
      placeholder: "勉強会, Drinkup, AfterTalk, ハンズオン"
    validations:
      required: false
