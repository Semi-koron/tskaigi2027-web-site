name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # gh-pages ブランチへの push

# gh-pages ブランチへの書き込みは本番・プレビューで直列化する
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # main に直接入ったコミットもここで止める
      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm check

      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          # PR プレビューを本番デプロイで消さない
          clean-exclude: pr-preview/
          force: false
