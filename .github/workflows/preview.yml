name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write # gh-pages ブランチへの push
  pull-requests: write # プレビュー URL のコメント

concurrency:
  group: gh-pages
  cancel-in-progress: false
  # 既定では待機できるのは1件で，後続に押し出された本番デプロイがキャンセルされるため
  queue: max

jobs:
  preview:
    # fork からの PR は GITHUB_TOKEN が読み取り専用なので対象外
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # contents: write のトークンを依存パッケージのコードから使わせない
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        if: github.event.action != 'closed'
        with:
          version: 12

      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'

      - run: pnpm build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}
          NOINDEX: true

      # opened / synchronize で配置，closed で削除し，PR に URL をコメントする
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
